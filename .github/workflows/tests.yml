# GitHub Actions workflow for running tests


name: Run Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - name: Check out repository
          uses: actions/checkout@v7
          
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.13'

        - name: Install dependencies
          run: 
            pip install -r requirements.txt

        - name: Run tests
          run:
            pytest tests/ -v